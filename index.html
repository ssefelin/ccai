<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Web Lab · 第二步</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">AGENT WEB LAB / 02</p>
        <h1>让对话带上上下文</h1>
        <p>先提问，再追问。观察历史消息如何成为下一次模型输入。</p>
      </header>
      <p id="mode" role="status">正在连接后端…</p>
      <p id="session"></p>
      <section aria-labelledby="chat-title">
        <h2 id="chat-title">本次会话</h2>
        <div id="messages"><p>还没有消息。</p></div>
        <p>消息保存在当前页面内存中。刷新或清空会话后丢失，其他标签页独立。</p>
      </section>
      <form id="question-form">
        <label for="prompt">你的问题</label>
        <textarea id="prompt" rows="7" maxlength="12000" required placeholder="粘贴一段代码，让模型解释它；也可以问：浏览器和后端分别做什么？"></textarea>
        <button id="submit" type="submit">发送问题</button>
        <button id="clear" class="secondary" type="button">清空会话</button>
        <label class="toggle"><input id="include-history" type="checkbox" checked /> 携带历史消息（关闭后只发送本次问题）</label>
      </form>
      <p id="status" role="status" aria-live="polite">准备就绪。</p>
      <section aria-labelledby="answer-title">
        <h2 id="answer-title">回答</h2>
        <pre id="answer">回答会显示在这里。</pre>
        <p id="metrics"></p>
      </section>
      <details>
        <summary>查看这次请求与响应</summary>
        <p>区分页面保存的消息、浏览器发送的消息，以及后端组装的模型输入。</p>
        <h3>浏览器 → 后端</h3><pre id="request">尚未发送</pre>
        <h3>后端 → 模型（演示模式不实际发送）</h3><pre id="model-request">尚未接收</pre>
        <h3>后端 → 浏览器</h3><pre id="response">尚未接收</pre>
      </details>
      <footer>第二步：多轮上下文 · 尚未加入工具或 Agent Loop</footer>
    </main>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
